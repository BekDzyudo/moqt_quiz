                <td style="padding: 14px 12px; border-bottom: 1px solid #e2eaf2;">{{r.done}}</td>
                <td style="padding: 14px 12px; border-bottom: 1px solid #e2eaf2;"><span style="{{r.stStyle}}"><span style="{{r.dot}}"></span>{{r.st}}</span></td>
